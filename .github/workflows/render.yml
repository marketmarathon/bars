name: Render bar chart race
on:
  workflow_dispatch:
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the RaceKit
        run: |
          unzip -q MarketMarathon_RaceKit.zip -d kit
          ls kit
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install dependencies
        working-directory: kit
        run: npm install
      - name: Download event images
        working-directory: kit
        run: bash fetch_panels.sh
      - name: Render the video (long step)
        working-directory: kit
        run: node racekit_full.js config.json
      - name: Publish the finished video
        uses: softprops/action-gh-release@v2
        with:
          tag_name: video-${{ github.run_number }}
          name: Bar chart race video ${{ github.run_number }}
          files: kit/master.mp4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
