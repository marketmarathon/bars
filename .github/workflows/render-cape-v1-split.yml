name: Render CAPE (World Stock Markets by CAPE Ratio, v1, split across runners)

# Playlist one, Market Cap Intelligence. "World Stock Markets by CAPE Ratio | 1982-2026".
# Same shard-and-join shape as the race, Market Cap History and Rise and Fall workflows, on
# purpose: the same lockfile guard, the same dataset-hash check, the same stall watchdog, the
# same mandatory bed, the same private YouTube upload. Three things genuinely differ and each
# is explained where it happens.
#
#   1. NO BROWSER AND NO SYSTEM FONTS. This renderer is node + @resvg/resvg-js. It builds an
#      SVG string per frame and hands resvg the typeface file directly with
#      loadSystemFonts:false, so there is no Chromium step, no Playwright step and no
#      fontconfig step - and no way for a runner to silently substitute a face. Do not add
#      them back "for consistency" with the Format C workflows.
#
#   2. SHARDING IS SAFE WITHOUT A WARM-UP HERE, and the warm-up is kept anyway. The row-count
#      glide and the axis ease are stateful; in this renderer they are eased ONCE across the
#      whole timeline into ROWS_AT / AXIS_AT lookup tables, so every frame is a pure function
#      of its index. That fix is what removed the visible pop at every shard join (6.95 mean
#      pixel change against 0.07 either side). racekit_q.js has the same class of state and no
#      warm-up at all - do not copy this sharding onto it before fixing that.
#
#   3. THE BED IS BUILT HERE, NOT BY build_bed.py, and it uses the Format C USA recipe. Each
#      track is capped just past the point it goes quiet before the crossfade, because these
#      tracks fade to silence at the end and a 6 s crossfade against a whole file starts after
#      the outgoing track has already gone. That put 2.9 s of silence at 7:30 into the first
#      Format C cut. build_bed.py takes whole files and cannot express a cap, so the caps live
#      in config.json and the mix happens below.
#
# The bed is EXACTLY the length of the video and fades out, rather than being longer and
# trimmed by -shortest. The video's length is never written down twice: it comes from the
# renderer's own frame plan.
#
# Run the gate before dispatching this. Do not use a render to find out the kit is wrong.

on:
  workflow_dispatch:
    inputs:
      shards:
        description: "How many runners to split the render across"
        required: true
        default: "18"
      raster_w:
        description: "3840 for a master (blueprint 1i.1), 1920 for a preview"
        required: true
        default: "3840"

env:
  KIT: MarketMarathon_RaceKit_CAPE_v1.zip

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      frames: ${{ steps.c.outputs.frames }}
      fps:    ${{ steps.c.outputs.fps }}
      matrix: ${{ steps.c.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: unzip -q "$KIT" -d kit

      # CAPE preflight. These are the five things that have actually gone wrong on this video,
      # checked before a runner is paid for.
      - name: Preflight - CAPE shape
        run: |
          python3 - <<'PY'
          import json, os, sys
          cfg = json.load(open('kit/config.json'))
          d   = json.load(open(os.path.join('kit', cfg['data'])))
          bad = []

          # 1. The split board is the approved cut. A kit that quietly falls back to the single
          #    board renders a different video under the same name.
          if cfg.get('LAYOUT') != 'split':
              bad.append('LAYOUT must be split, got %r' % cfg.get('LAYOUT'))
          if cfg.get('SPLIT_PER_SIDE') != 10:
              bad.append('SPLIT_PER_SIDE must be 10, got %r' % cfg.get('SPLIT_PER_SIDE'))
          for k in ('SPLIT_HEADING_LEFT', 'SPLIT_HEADING_RIGHT'):
              if not cfg.get(k): bad.append('%s is empty' % k)

          # 2. The data must be the workbook the dataset builder recorded. A JSON rebuilt from a
          #    different workbook would render silently and wrongly.
          if not d.get('source_workbook_sha256'):
              bad.append('the race JSON carries no source_workbook_sha256')
          if d.get('period_kind') != 'quarter':
              bad.append('this cut is quarterly; the JSON says period_kind=%r' % d.get('period_kind'))

          # 3. Every caption must land on a real quarter and fit the caption plate. A quarter key
          #    that resolves to nothing is invisible - the caption simply never appears.
          periods = list(d['periods'])
          ev = json.load(open(os.path.join('kit', cfg['events'])))
          events = ev.get('events', [])
          for e in events:
              q = e.get('quarter')
              if q is None:
                  continue
              if q not in periods:
                  bad.append('caption quarter %r is not in the data' % q)
              if len(e.get('text', '')) > 150:
                  bad.append('caption %s is %d characters, the plate holds 150' % (q, len(e['text'])))
          # This counts quarters that CARRY a caption, not quarters a caption is visible in -
          # CAPTION_QUARTERS holds each one on screen for two, so the seen coverage is higher.
          print('captions: %d, on %d of %d quarters'
                % (len(events), len({e.get('quarter') for e in events} & set(periods)), len(periods)))

          # 4. Colour carries meaning in this cut, so the scheme and its legend must both be here.
          if cfg.get('COLOUR_SCHEME') != 'region':
              bad.append('COLOUR_SCHEME must be region, got %r' % cfg.get('COLOUR_SCHEME'))
          for k in ('palettes', 'font', 'flags_dir', 'logo'):
              p = os.path.join('kit', cfg[k])
              if not os.path.exists(p): bad.append('missing %s: %s' % (k, cfg[k]))

          # 5. The coverage card is the honest-framing decision of 21 Sep. If it is dropped, the
          #    intro strapline claiming 25 markets is left contradicting a video that names none.
          if not cfg.get('coverage_heading') or not cfg.get('coverage_groups'):
              bad.append('the absentees end-card is missing from config')
          if '25' not in cfg.get('intro_strapline', ''):
              bad.append('intro_strapline no longer states the market count: %r' % cfg.get('intro_strapline'))
          n_markets = len(d['countries'])
          if n_markets != 25:
              bad.append('the data holds %d markets but the strapline says 25' % n_markets)

          for b in bad: print('::error::' + b)
          print('CAPE preflight: %d quarters %s..%s, %d markets'
                % (len(periods), periods[0], periods[-1], n_markets))
          sys.exit(1 if bad else 0)
          PY

      # Blueprint 1j: a kit without a lockfile builds against whatever the registry serves
      # that day. Refuse it here rather than render something unreproducible.
      - name: Preflight - kit must carry a lockfile
        run: |
          test -f kit/package-lock.json || {
            echo "::error::Kit has no package-lock.json - refusing to build an unpinned render"; exit 1; }
      - run: npm ci --no-audit --no-fund
        working-directory: kit

      # Blueprint 3a.3: record exactly what was rendered from. dataset_hashes.txt carries
      # header lines, so take only the sha256sum lines before comparing.
      - name: Record dataset hashes
        working-directory: kit
        run: |
          grep -E '^[0-9a-f]{64}  ' dataset_hashes.txt > .hashes.txt
          cut -c67- .hashes.txt > .files.txt
          sha256sum $(cat .files.txt | tr '\n' ' ') > dataset_hashes_run.txt
          diff <(sort .hashes.txt) <(sort dataset_hashes_run.txt) || {
            echo "::error::a data file changed between the frozen dataset and this render"; exit 1; }
          npm ls --all 2>&1 | tee dependency_tree.txt
      - uses: actions/upload-artifact@v4
        with:
          name: cape-v1-run-evidence
          path: |
            kit/dataset_hashes.txt
            kit/dependency_tree.txt
          retention-days: 90

      - id: c
        working-directory: kit
        run: |
          PLAN=$(FRAME_COUNT_ONLY=1 node src/cape_race.js)
          echo "$PLAN"
          TOTAL=$(echo "$PLAN" | grep -o 'FRAMES [0-9]*' | cut -d' ' -f2)
          FPS=$(echo "$PLAN" | grep -o 'FPS [0-9]*' | cut -d' ' -f2)
          test -n "$TOTAL" || { echo "::error::could not read the frame count"; exit 1; }
          test -n "$FPS"   || { echo "::error::could not read the frame rate"; exit 1; }
          echo "frames=$TOTAL" >> $GITHUB_OUTPUT
          echo "fps=$FPS" >> $GITHUB_OUTPUT
          echo "matrix=$(python3 -c "import json;print(json.dumps(list(range(${{ inputs.shards }}))))")" >> $GITHUB_OUTPUT
          echo "::notice::$TOTAL frames at $FPS fps across ${{ inputs.shards }} runners at ${{ inputs.raster_w }} wide"

  render:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: unzip -q "$KIT" -d kit
      - run: npm ci --no-audit --no-fund
        working-directory: kit
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      # The typeface is handed to resvg as a file, so prove the file is here rather than
      # trusting fontconfig - there is no fontconfig in this job.
      - name: Prove the typeface shipped
        run: |
          F=$(python3 -c "import json;print(json.load(open('kit/config.json'))['font'])")
          test -s "kit/$F" || { echo "::error::the kit carries no $F - refusing to render"; exit 1; }
          ls -la "kit/$F"

      - name: Render slice ${{ matrix.shard }}
        working-directory: kit
        env:
          TOTAL:    ${{ needs.plan.outputs.frames }}
          SHARDS:   ${{ inputs.shards }}
          I:        ${{ matrix.shard }}
          RASTER_W: ${{ inputs.raster_w }}
        run: |
          PER=$(( (TOTAL + SHARDS - 1) / SHARDS ))
          A=$(( I * PER )); B=$(( A + PER )); [ $B -gt $TOTAL ] && B=$TOTAL
          if [ $A -ge $TOTAL ]; then echo "nothing to do for shard $I"; exit 0; fi
          echo "slice $I: frames $A to $((B-1)) of $TOTAL"
          set +e
          # --expose-gc is not optional: @resvg/resvg-js 2.6.2 never releases the rendered
          # pixmap (about 8 MB a frame at 1080p, four times that at 4K) and the renderer nudges
          # the collector on a fixed cadence. Without it a shard is OOM-killed part way through.
          SEG_START=$A SEG_END=$B OUT="seg_$(printf %03d $I).mp4" \
            node --expose-gc --max-old-space-size=4096 src/cape_race.js > render.log 2>&1 &
          RPID=$!; tail -f render.log & TPID=$!
          STALL=0
          while kill -0 $RPID 2>/dev/null; do
            sleep 15
            IDLE=$(( $(date +%s) - $(stat -c %Y render.log) ))
            if [ "$IDLE" -ge 240 ]; then
              echo "::error::RENDER STALLED - no output for ${IDLE}s"; tail -40 render.log
              kill -9 $RPID 2>/dev/null; STALL=1; break
            fi
          done
          RC=0; wait $RPID || RC=$?
          sleep 2; kill $TPID 2>/dev/null
          [ "$STALL" -eq 1 ] && exit 1
          exit $RC
      - run: ls -la kit/seg_*.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: seg-${{ matrix.shard }}
          path: kit/seg_*.mp4
          retention-days: 2
          compression-level: 0

  join:
    needs: [plan, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q "$KIT" -d kit
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - uses: actions/download-artifact@v4
        with: { pattern: seg-*, merge-multiple: true, path: segs }

      # D38: music is mandatory and NEVER ships in the kit. The Audio Library licence forbids
      # distributing the files separately from a video and this repo is public, so the tracks
      # come from the private marketmarathon/audio release.
      - name: Fetch the licensed tracks and build the bed
        env:
          GH_TOKEN:     ${{ secrets.AUDIO_REPO_TOKEN }}
          AUDIO_REPO:   marketmarathon/audio
          AUDIO_TAG:    audio-v2
          AUDIO_ASSET:  MarketMarathon_Audio_v2.zip
          AUDIO_SHA256: 3db90f6017f9c9e0e51861cc2ce213ae72affd39c112860a972c125b9c02467e
          FRAMES:       ${{ needs.plan.outputs.frames }}
          FPS:          ${{ needs.plan.outputs.fps }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "::error::AUDIO_REPO_TOKEN is not set, so no bed can be built. Blueprint 1.9.0 requires music on every video."; exit 1; }
          URL=$(curl -sSf -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                "https://api.github.com/repos/$AUDIO_REPO/releases/tags/$AUDIO_TAG" \
                | python3 -c "import json,sys,os;d=json.load(sys.stdin);print(next(a['url'] for a in d['assets'] if a['name']==os.environ['AUDIO_ASSET']))")
          curl -sSfL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o audio.zip "$URL"
          echo "$AUDIO_SHA256  audio.zip" | sha256sum -c -
          unzip -q audio.zip -d audio
          python3 - <<'EOF'
          import json, os, re, subprocess, sys
          cfg = json.load(open('kit/config.json'))
          # The video's length comes from the renderer's own plan, never from a second copy of
          # the durations in config.json.
          dur = float(os.environ['FRAMES']) / float(os.environ['FPS'])
          xf  = cfg['bed_crossfade_sec']
          root = 'audio'
          if not os.path.isdir(os.path.join(root, cfg['bed_folder'])):
              hits = [d for d,_,_ in os.walk('audio') if os.path.basename(d) == cfg['bed_folder']]
              if not hits:
                  print('::error::the audio release has no %r folder' % cfg['bed_folder']); sys.exit(1)
              root = os.path.dirname(hits[0])
          args = ['ffmpeg','-hide_banner','-loglevel','error','-y']
          parts, n = [], len(cfg['bed_tracks'])
          for i,t in enumerate(cfg['bed_tracks']):
              p = os.path.join(root, t['file'])
              if not os.path.exists(p):
                  print('::error::bed track missing from the release: %s' % p); sys.exit(1)
              if t.get('cap_sec'): args += ['-t', str(t['cap_sec'])]
              args += ['-i', p]
              parts.append('[%d:a]volume=%sdB[g%d]' % (i, t['gain_db'], i))
          prev = '[g0]'
          for i in range(1, n):
              parts.append('%s[g%d]acrossfade=d=%s:c1=tri:c2=tri[x%d]' % (prev, i, xf, i)); prev = '[x%d]' % i
          parts.append('%salimiter=level_in=1:level_out=1:limit=0.841:attack=5:release=50:level=disabled[out]' % prev)
          args += ['-filter_complex', ';'.join(parts), '-map', '[out]', '-ar', '48000', '-ac', '2', 'stitched.flac']
          subprocess.check_call(args)
          d = float(subprocess.run(['ffprobe','-v','error','-show_entries','format=duration','-of','csv=p=0','stitched.flac'],
                                   capture_output=True, text=True).stdout)
          print('stitched %.1fs against a %.1fs video' % (d, dur))
          if d < dur:
              print('::error::the stitched bed is %.1fs but the video is %.1fs' % (d, dur)); sys.exit(1)
          # No hole may survive into the video. The one at the very start is Serenity's own quiet
          # opening and sits under the title card, which is wanted.
          out = subprocess.run(['ffmpeg','-hide_banner','-nostats','-i','stitched.flac',
                                '-t',str(dur),'-af','silencedetect=noise=-42dB:d=0.8','-f','null','-'],
                               capture_output=True, text=True).stderr
          ends = re.findall(r'silence_end: ([\d.]+) \| silence_duration: ([\d.]+)', out)
          bad = [(float(e)-float(l), float(e)) for e,l in ends if float(e)-float(l) > 2.0]
          for st,en in bad: print('::error::the bed goes silent for %.1fs at %.0fs' % (en-st, st))
          if bad: sys.exit(1)
          fi, fo = cfg['bed_fade_in_sec'], cfg['bed_fade_out_sec']
          af = 'afade=t=in:st=0:d=%s,afade=t=out:st=%s:d=%s' % (fi, dur-fo, fo)
          # D41: two passes, so -14.0 LUFS is exact rather than assumed. TP aims at -2.5, not
          # -2.0, because the AAC mux overshoots about 0.9 dB.
          m = subprocess.run(['ffmpeg','-hide_banner','-nostats','-i','stitched.flac','-t',str(dur),
                              '-af', af + ',loudnorm=I=-14:TP=-2.5:LRA=7:print_format=json','-f','null','-'],
                             capture_output=True, text=True).stderr
          j = json.loads(m[m.rindex('{'):m.rindex('}')+1])
          print('bed measured: I=%s TP=%s LRA=%s' % (j['input_i'], j['input_tp'], j['input_lra']))
          subprocess.check_call(['ffmpeg','-v','error','-y','-i','stitched.flac','-t',str(dur),
            '-af', af + ',loudnorm=I=-14:TP=-2.5:LRA=7:linear=true:measured_I=%s:measured_TP=%s:measured_LRA=%s:measured_thresh=%s:offset=%s'
              % (j['input_i'], j['input_tp'], j['input_lra'], j['input_thresh'], j['target_offset']),
            '-ar','48000','-ac','2','bed.flac'])
          print('bed built: %.1fs' % dur)
          EOF

      - name: Join, mux and verify against the master contract
        env:
          TOTAL: ${{ needs.plan.outputs.frames }}
          RASTER_W: ${{ inputs.raster_w }}
        run: |
          ls -la segs
          python3 - <<'PY'
          import json, os, re, glob, subprocess, sys
          total = int(os.environ['TOTAL']); rw = int(os.environ['RASTER_W'])
          cfg = json.load(open('kit/config.json'))
          final = cfg['out']
          segs = sorted(glob.glob('segs/seg_*.mp4'))
          if not segs: print('::error::no segments to join'); sys.exit(1)
          print('joining %d slices' % len(segs))
          with open('l.txt','w') as f:
              for s in segs: f.write("file '%s/%s'\n" % (os.getcwd(), s))
          subprocess.check_call(['ffmpeg','-v','error','-y','-f','concat','-safe','0','-i','l.txt',
                                 '-c','copy','-movflags','+faststart','joined.mp4'])
          # volume=1.0: the level lives in the bed at -14.0 LUFS under D41, never in a
          # multiplier here. The bed is already exactly the video's length and already faded,
          # so nothing is looped and nothing is trimmed mid-phrase.
          subprocess.check_call(['ffmpeg','-v','error','-y','-i','joined.mp4','-i','bed.flac',
              '-map','0:v:0','-map','1:a:0','-c:v','copy','-c:a','aac','-b:a','192k',
              '-ar','48000','-ac','2','-shortest','-movflags','+faststart',final])
          p = subprocess.run(['ffprobe','-v','error','-show_entries',
              'stream=width,height,r_frame_rate,codec_name,profile,pix_fmt,color_primaries,'
              'color_transfer,color_space,nb_frames,sample_rate','-show_entries',
              'format=duration,size,bit_rate','-of','json',final], capture_output=True)
          d = json.loads(p.stdout)
          v = next((x for x in d['streams'] if x.get('width')), {})
          a = next((x for x in d['streams'] if x.get('sample_rate')), {})
          fm = d['format']
          print('\n================ MASTER ================')
          print('%s' % final)
          print('  %sx%s  %s fps  %s (%s)  %s' % (v.get('width'), v.get('height'),
                v.get('r_frame_rate'), v.get('codec_name'), v.get('profile'), v.get('pix_fmt')))
          print('  colour %s/%s/%s  audio %s Hz' % (v.get('color_primaries'),
                v.get('color_transfer'), v.get('color_space'), a.get('sample_rate')))
          print('  %s frames  %.1f s  %.2f GB  %.2f Mbps' % (v.get('nb_frames'),
                float(fm['duration']), int(fm['size'])/1e9, int(fm.get('bit_rate',0))/1e6))
          # Blueprint 1i.1, the D27 table. A file that misses any row is a preview whatever it
          # is called and may not be published, so say so here rather than downstream.
          bad = []
          if int(v.get('nb_frames',0)) != total: bad.append('%s frames, expected %d' % (v.get('nb_frames'), total))
          if int(v.get('width',0)) != rw:        bad.append('raster is %sx%s, asked for %s wide' % (v.get('width'), v.get('height'), rw))
          if int(a.get('sample_rate',0)) != 48000: bad.append('audio is %s Hz, the contract requires 48000' % a.get('sample_rate'))
          for k in ('color_primaries','color_transfer','color_space'):
              if v.get(k) != 'bt709': bad.append('%s reads %r, the contract requires bt709' % (k, v.get(k)))
          # Blueprint 1i.1 puts a 3 Mbps floor on a 4K master. That floor is a PROXY for "did the
          # configured CRF actually reach the encoder", and it is the wrong proxy for this video.
          # A bar chart race is flat vector graphics on a dark background and compresses far
          # harder than the live-action footage the floor was written against. Measured at crf 16
          # and 3840 wide, this content runs 0.64 Mbps over the end cards, 1.8-2.2 over the sparse
          # early years, 2.9 over the 2020s and 4.9 over the busiest 2000s churn - a whole-video
          # average near 2.9. Run 1 on 21 Sep 2026 failed at 2.89 Mbps with a perfectly good
          # master, and encoding it fatter would have spent bitrate to satisfy a proxy.
          #
          # So test the thing itself. x264 writes its own settings into an SEI in the stream, so
          # the CRF that reached the encoder can be read straight out of the finished file and
          # compared with config.json. The bitrate floor stays as a backstop, dropped to a level
          # only a catastrophically wrong encode could reach.
          want_crf = float(cfg['crf'])
          got_crf = None
          with open(final, 'rb') as fh:
              tail = b''
              while True:
                  chunk = fh.read(8 << 20)
                  if not chunk: break
                  m = re.search(rb'x264 - core.*?crf=([0-9.]+)', tail + chunk, re.S)
                  if m: got_crf = float(m.group(1)); break
                  tail = chunk[-4096:]
          if got_crf is None:
              bad.append('the stream carries no x264 settings block - cannot prove which CRF reached the encoder')
          elif abs(got_crf - want_crf) > 0.001:
              bad.append('x264 recorded crf=%s but config.json asks for %s' % (got_crf, want_crf))
          else:
              print('  x264 recorded crf=%s, matching config' % got_crf)
          if rw == 3840 and int(fm.get('bit_rate',0)) < 1_000_000:
              bad.append('%.2f Mbps is implausibly thin even for vector content - check the encoder' % (int(fm['bit_rate'])/1e6))
          for b in bad: print('::error::' + b)
          sys.exit(1 if bad else 0)
          PY

      # The master is never downloaded. A 720p copy and a contact sheet check in seconds, and
      # the master itself goes straight to the channel as a PRIVATE video.
      - name: Build review assets
        run: |
          MASTER="$(ls *_master*.mp4 | head -1)"
          echo "master: $MASTER"
          bash make_review_assets.sh "$MASTER" 20 review
      - uses: actions/upload-artifact@v4
        with:
          name: cape-review-v1
          path: |
            review/review_720p.mp4
            review/frames_page_*.png
          retention-days: 30
      - name: Upload master to YouTube as private
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          MASTER="$(ls *_master*.mp4 | head -1)"
          PLAYLIST="$(python3 -c "import json;print(json.load(open('kit/config.json')).get('youtube_playlist',''))")"
          python3 yt_upload.py --file "$MASTER" \
            ${PLAYLIST:+--playlist "$PLAYLIST"} \
            --title "Market Marathon CAPE v1 render $(date -u +%Y-%m-%d) - PRIVATE, unreviewed" \
            --desc "Automatic private upload from GitHub Actions run ${{ github.run_id }}. Nothing is public. Check the review copy, then set the real title, description and thumbnail before publishing." \
            --privacy private
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cape-master-v1-fallback
          path: "*_master*.mp4"
          retention-days: 5
          compression-level: 0
