name: Render France video
on: { workflow_dispatch: {} }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Unzip kit
        run: unzip -q MarketMarathon_RaceKit_FR.zip -d kit && cp racekit_full.js kit/racekit_full.js
      - name: Install deps
        working-directory: kit
        run: npm ci || npm install
      - name: Render
        working-directory: kit
        run: |
          bash fetch_panels.sh
          node racekit_full.js config.json
      - uses: actions/upload-artifact@v4
        with:
          name: master-mp4-fr
          path: kit/master.mp4
