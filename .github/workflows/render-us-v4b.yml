name: Render US video (v4b gold standard)
on: { workflow_dispatch: {} }
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Unzip kit
        run: unzip -q MarketMarathon_RaceKit_US_v4b.zip -d kit

      # A kit without a lockfile builds against whatever the registry serves that day.
      # Blueprint D24: reject it here rather than render something unreproducible.
      - name: Preflight - kit must carry a lockfile
        run: |
          test -f kit/package-lock.json || {
            echo "::error::Kit has no package-lock.json - refusing to build an unpinned render (blueprint D24)"
            exit 1
          }
          echo "lockfile present:"; head -5 kit/package-lock.json

      # Plain `npm ci`. NEVER `npm ci || npm install` - that fallback swallowed a missing
      # lockfile silently through runs #1-#4 on 21-22 Aug 2026 (blueprint D24).
      - name: Install deps
        working-directory: kit
        run: npm ci --no-audit --no-fund

      # Blueprint D24 3a.3: the render records exactly what it rendered, so a frozen
      # dataset can be verified against the run instead of assumed to match it.
      - name: Record dataset hashes
        working-directory: kit
        run: |
          sha256sum config.json us_race_quarterly.json us_periods.json us_roi_tracker.json \
                    spx.json us_stories_v2.json event_icons_v2.json subsector_icons.json \
                    story_logos.json racekit_q_v4b.js | tee dataset_hashes.txt

      # Also record the resolved dependency tree, so a future failure can be compared
      # against a run that worked rather than guessed at.
      - name: Record dependency tree
        working-directory: kit
        run: npm ls --all 2>&1 | tee dependency_tree.txt

      # v4b: horizontal news ticker, era-correct company logos, rebranding flash, date chip,
      # title card with the MM logo. 44,484 frames -> roughly 45-80 min on a hosted runner.
      # The watchdog fails the step if the renderer produces no output for 120s, so a dead
      # render dies in two minutes instead of idling until a human notices (blueprint D24).
      - name: Render
        working-directory: kit
        run: |
          set +e
          node racekit_q_v4b.js > render.log 2>&1 &
          RPID=$!
          tail -f render.log &
          TPID=$!
          STALL=0
          while kill -0 $RPID 2>/dev/null; do
            sleep 15
            NOW=$(date +%s); LAST=$(stat -c %Y render.log)
            IDLE=$((NOW - LAST))
            if [ "$IDLE" -ge 120 ]; then
              echo "::error::RENDER STALLED - no output for ${IDLE}s. Killing the renderer."
              echo "--- last 40 lines of render.log ---"; tail -40 render.log
              kill -9 $RPID 2>/dev/null
              STALL=1
              break
            fi
          done
          RC=0; wait $RPID || RC=$?
          sleep 2; kill $TPID 2>/dev/null
          if [ "$STALL" -eq 1 ]; then exit 1; fi
          exit $RC

      - name: Report
        working-directory: kit
        run: ls -la master.mp4 && ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 master.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: us-master-v4b
          path: kit/master.mp4
          retention-days: 90
      - name: Upload run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: us-v4b-dataset-hashes
          path: |
            kit/dataset_hashes.txt
            kit/dependency_tree.txt
            kit/render.log
          retention-days: 90
